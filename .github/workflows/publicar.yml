# Publica uma release quando uma versão nova chega em publicar/.
# publicar/versao.txt  → número da versão (ex.: 1.1.0)
# publicar/notas.md    → o que mudou
# publicar/*.exe e publicar/resources.neu → arquivos da release
name: Publicar versão
on:
  push:
    branches: [main]
    paths: ['publicar/versao.txt']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(tr -d ' \r\n' < publicar/versao.txt)
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V já existe"; exit 0; fi
          gh release create "v$V" publicar/resources.neu publicar/ML-Acervo-3D-Setup-v$V.exe \
            --title "ML Acervo 3D $V" --notes-file publicar/notas.md --target main --latest
